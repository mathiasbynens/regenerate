name: run-checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Include all major maintenance + active LTS + current Node.js versions.
        # https://github.com/nodejs/Release#release-schedule
        node: [22, 24, 26]
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up the latest Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install dependencies
        run: npm install
      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Test
        run: npm test

  coveralls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Test with coverage
        run: >-
          NODE_V8_COVERAGE=coverage node --test --experimental-test-coverage
          --test-coverage-exclude=tests/tests.js
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=lcov.info
          tests/tests.js
      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: lcov.info

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      # Each run uses a new random seed, which is printed in the log. A failure
      # comes with an `npm run fuzz -- ... --replay <seed>` command to reproduce it.
      - name: Fuzz
        run: npm run fuzz -- --duration 60

  node-6-compat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 6
        uses: actions/setup-node@v7
        with:
          node-version: 6
      - name: Install dependencies
        run: npm install
      - name: Install mocha 6
        run: npm install mocha@6 -D --save
      - name: Test
        run: npm run test-node6
